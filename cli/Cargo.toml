[package]
name = "rusty-lints"
version = "0.2.1"
description = "Rust lints that Clippy does not have: a syntax scan, and Dylint lints that see types"
edition = "2024"
license = "MIT"
repository = "https://github.com/bwks/rusty-lints"
publish = false

[dependencies]
anyhow = "=1.0.105"
clap = { version = "=4.6.7", features = ["derive"] }
proc-macro2 = { version = "=1.0.107", features = ["span-locations"] }
serde = { version = "=1.0.229", features = ["derive"] }
syn = { version = "=3.0.10", features = ["full", "visit"] }
toml = "=1.2.2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
