name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  DYLINT_VERSION: 6.4.0

jobs:
  cli:
    name: rusty-lints (stable, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked

  dylint:
    name: Dylint lints and rusty-lints all (pinned nightly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Read the pinned nightly
        id: toolchain
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' dylint/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - name: Cache the nightly
        uses: actions/cache@v5
        with:
          path: ~/.rustup/toolchains/${{ steps.toolchain.outputs.channel }}-x86_64-unknown-linux-gnu
          key: rustup-${{ hashFiles('dylint/rust-toolchain.toml') }}
      - name: Cache the Dylint tools and drivers
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/cargo-dylint
            ~/.cargo/bin/dylint-link
            ~/.dylint_drivers
          key: dylint-${{ env.DYLINT_VERSION }}-${{ hashFiles('dylint/rust-toolchain.toml') }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            dylint
            . -> target
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Build rusty-lints
        run: cargo +stable build --release --locked
      - name: rusty-lints all on this repository, with the lints in this checkout
        run: target/release/rusty-lints all --path . --install
      - name: UI tests
        working-directory: dylint
        run: cargo test
