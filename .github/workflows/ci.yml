name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  DYLINT_VERSION: 6.4.0

jobs:
  scan:
    name: rusty-scan (stable)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scan
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: scan
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Check this repository
        run: cargo run --release -- ..

  dylint:
    name: Dylint lints (pinned nightly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the pinned nightly
        id: toolchain
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' dylint/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - name: Cache the nightly
        uses: actions/cache@v4
        with:
          path: ~/.rustup/toolchains/${{ steps.toolchain.outputs.channel }}-x86_64-unknown-linux-gnu
          key: rustup-${{ hashFiles('dylint/rust-toolchain.toml') }}
      - name: Cache the Dylint tools and drivers
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-dylint
            ~/.cargo/bin/dylint-link
            ~/.dylint_drivers
          key: dylint-${{ env.DYLINT_VERSION }}-${{ hashFiles('dylint/rust-toolchain.toml') }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            dylint
            scan -> target/dylint
      - name: Install the Dylint tools
        run: |
          if ! command -v cargo-dylint >/dev/null || ! command -v dylint-link >/dev/null; then
            cargo +stable install --locked cargo-dylint dylint-link --version "$DYLINT_VERSION"
          fi
      - name: Install the pinned nightly
        working-directory: dylint
        run: rustup toolchain install
      - name: UI tests
        working-directory: dylint
        run: cargo test
      - name: Lint rusty-scan with the Dylint lints
        working-directory: scan
        env:
          DYLINT_RUSTFLAGS: -D warnings
        run: DYLINT_TOML="$(cat ../rusty-lints.toml)" cargo dylint --path .. --pattern 'dylint/*' --all -- --all-targets
