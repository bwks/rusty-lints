[workspace]
members = ["error_text_match", "single_use_closure"]
resolver = "3"

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/bwks/rusty-lints"
publish = false

[workspace.dependencies]
clippy_utils = { git = "https://github.com/rust-lang/rust-clippy", rev = "21baba9c10c5d179915cae82e6247bc2337872fb" }
dylint_linting = "=6.4.0"
dylint_testing = "=6.4.0"
serde = { version = "=1.0.229", features = ["derive"] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[workspace.metadata.rust-analyzer]
rustc_private = true
